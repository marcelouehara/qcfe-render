name: corte

# O n8n dispara com repository_dispatch (event_type "corte"). Payload: ver corte.py.
# Saida no branch "videos" (GitHub Pages): <id>.mp4, <id>.json e historico.json (clipes ja usados ou descartados).
on:
  repository_dispatch:
    types: [corte]

permissions:
  contents: write

concurrency:
  group: corte
  cancel-in-progress: false

jobs:
  corte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache do modelo whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Dependencias
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            curl -sfL --retry 3 --max-time 240 -o /tmp/ff.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz && break
            echo "download do ffmpeg falhou (tentativa $i)"; sleep 10
          done
          if [ -s /tmp/ff.tar.xz ]; then
            mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            echo "/tmp/ff/bin" >> "$GITHUB_PATH"; export PATH="/tmp/ff/bin:$PATH"
          else
            timeout 120 sudo apt-get update -qq || true
            timeout 300 sudo apt-get install -y -qq ffmpeg > /dev/null
          fi
          ffmpeg -version | head -1
          for i in 1 2 3; do
            timeout 300 pip install -q --retries 5 --timeout 30 -r requirements.txt && break; sleep 15
          done

      - name: Escolher e renderizar
        env:
          JOB: ${{ toJson(github.event.client_payload) }}
          # YouTube pela API (secrets do repo); sem eles o corte.py pula a API e o n8n manda o YouTube pelo Buffer
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 corte.py

      # Branch "videos" sem historico git: guarda os 10 cortes mais recentes + historico.json
      - name: Publicar no branch videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pub
          if git fetch -q origin videos; then git archive FETCH_HEAD | tar -x -C /tmp/pub; fi
          cp out/*.json /tmp/pub/ 2>/dev/null || true
          cp out/*.mp4 /tmp/pub/ 2>/dev/null || true
          rm -f /tmp/pub/historico_add.json
          python3 - <<'EOF'
          import json, os
          p = "/tmp/pub/historico.json"
          h = json.load(open(p)) if os.path.exists(p) else []
          h += [i for i in json.load(open("out/historico_add.json")) if i not in h]
          json.dump(h[-2000:], open(p, "w"))
          EOF
          cd /tmp/pub
          ls *.mp4 2>/dev/null | sort | head -n -10 | sed 's/\.mp4$//' | while read id; do rm -f "$id.mp4" "$id.words.json"; done
          ls -t *.json | grep -v historico.json | tail -n +60 | xargs -r rm -f
          git init -q -b videos
          git config user.name "qcfe-render"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "corte $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" videos
